app = "lucro-caseiro-site"
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "apps/web/Dockerfile"

[build.args]
  NEXT_PUBLIC_GA_ID = "G-ZLQE9DXQB9"
  NEXT_PUBLIC_API_URL = "https://api.lucrocaseiro.com.br"
  NEXT_PUBLIC_SITE_URL = "https://lucrocaseiro.com.br"
  NEXT_PUBLIC_SUPABASE_URL = "https://ujwxvpceqigvyxcqolch.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_62oHpKLLLGkVgWqA-aZ9Pg_bLR1UiCq"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  NEXT_PUBLIC_API_URL = "https://api.lucrocaseiro.com.br"
  NEXT_PUBLIC_SITE_URL = "https://lucrocaseiro.com.br"
  NEXT_PUBLIC_SUPABASE_URL = "https://ujwxvpceqigvyxcqolch.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_62oHpKLLLGkVgWqA-aZ9Pg_bLR1UiCq"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"
  method = "GET"
  path = "/"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
