# 21 — Regressão mobile: venda avulsa já avança para produtos.
appId: br.com.orionseven.lucrocaseiro
name: 21 - Nova venda CTA acima da tab bar
tags:
  - navigation
  - readonly
---
- runFlow:
    file: ../subflows/open-app.yaml
    env:
      EMAIL: "${EMAIL}"
      PASSWORD: "${PASSWORD}"

- tapOn:
    point: "10%,94%"
- assertVisible: "Dinheiro|Início"
- tapOn: "Nova venda"
- runFlow:
    when:
      visible: "Agora n"
    commands:
      - tapOn: "Agora n"
- runFlow:
    when:
      visible: "Escolher produtos"
    commands:
      - tapOn: "Escolher produtos"
- extendedWaitUntil:
    visible:
      text: "Venda avulsa|O que voc|Para quem"
    timeout: 8000
- runFlow:
    when:
      visible: "Venda avulsa"
    commands:
      - tapOn: "Venda avulsa"
- assertVisible: "O que voc|Venda avulsa"
- takeScreenshot: .maestro/screenshots/21-nova-venda-cta
