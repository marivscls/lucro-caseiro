# 18 — Abre uma venda da lista e cancela se ainda estiver ativa.
appId: br.com.orionseven.lucrocaseiro
name: 18 - Acoes de venda
tags:
  - crud
---
- runFlow:
    file: ../subflows/open-app.yaml
    env:
      EMAIL: "${EMAIL}"
      PASSWORD: "${PASSWORD}"

- repeat:
    times: 8
    commands:
      - runFlow:
          when:
            visible: "Dismiss"
          commands:
            - tapOn: "Dismiss"
      - runFlow:
          when:
            notVisible: "Todas"
          commands:
            - tapOn:
                point: "30%,94%"
- assertVisible: "Todas"
- tapOn: "Ecobag personalizada|Brigadeiro teste|Marcador de p"
- extendedWaitUntil:
    visible:
      text: "Total|Cancelar venda"
    timeout: 8000
- runFlow:
    when:
      visible: "Cancelar venda"
    commands:
      - tapOn: "Cancelar venda"
      - runFlow:
          when:
            visible: "Sim, cancelar"
          commands:
            - tapOn: "Sim, cancelar"
- takeScreenshot: .maestro/screenshots/18-venda-acao
