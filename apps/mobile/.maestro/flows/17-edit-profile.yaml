# 17 — Edita o perfil: cartao da aba Mais abre Configuracoes, depois o lapis.
appId: br.com.orionseven.lucrocaseiro
name: 17 - Editar perfil
tags:
  - crud
---
- runFlow:
    file: ../subflows/open-app.yaml
    env:
      EMAIL: "${EMAIL}"
      PASSWORD: "${PASSWORD}"

- repeat:
    times: 8
    commands:
      - runFlow:
          when:
            visible: "Dismiss"
          commands:
            - tapOn: "Dismiss"
      - runFlow:
          when:
            notVisible: "Mais opções"
          commands:
            - tapOn:
                point: "90%,94%"
- tapOn: "Editar perfil"

- extendedWaitUntil:
    visible:
      text: "Seu plano|Gratuito|do seu jeito"
    timeout: 10000
- tapOn: "Editar perfil"

- extendedWaitUntil:
    visible:
      text: "Adicionar foto|Nome do neg|Salvar"
    timeout: 8000
- tapOn: "Nome do negocio"
- eraseText
- inputText: "[e2e] Negocio Teste"
- tapOn:
    text: "^Salvar$"
    point: "50%, 20%"
- tapOn:
    point: "50%,55%"
- takeScreenshot: .maestro/screenshots/17-perfil
