# 07 — Criar material/insumo. Gera dado real.
appId: br.com.orionseven.lucrocaseiro
name: 07 - Criar insumo
tags:
  - crud
---
- runFlow:
    file: ../subflows/open-app.yaml
    env:
      EMAIL: "${EMAIL}"
      PASSWORD: "${PASSWORD}"

- runFlow:
    file: ../subflows/open-more.yaml
- scrollUntilVisible:
    element:
      text: "Materiais"
    direction: DOWN
    centerElement: true
- tapOn: "Materiais. Custos|Materiais"
- runFlow:
    file: ../subflows/dismiss-guidance.yaml
- tapOn: "Cadastrar material|Adicionar primeiro material|Novo material|. Novo material"

- extendedWaitUntil:
    visible:
      text: "Nome do insumo|Nome do material"
    timeout: 8000
- tapOn:
    below:
      text: "Nome do insumo|Nome do material"
- inputText: "[e2e] Insumo Teste"
- tapOn: "Unidade"
- tapOn:
    text: "^un$"
- tapOn: "Nome do insumo|Nome do material"
- tapOn: "Salvar insumo|Salvar material"

- extendedWaitUntil:
    visible:
      text: "[e2e] Insumo Teste"
    timeout: 10000
- takeScreenshot: .maestro/screenshots/07-insumo
