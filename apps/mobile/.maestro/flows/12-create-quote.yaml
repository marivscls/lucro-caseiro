# 12 — Criar orcamento (wizard Cliente / Itens / Detalhes).
appId: br.com.orionseven.lucrocaseiro
name: 12 - Criar orcamento
tags:
  - crud
---
- runFlow:
    file: ../subflows/open-app.yaml
    env:
      EMAIL: "${EMAIL}"
      PASSWORD: "${PASSWORD}"

- runFlow:
    file: ../subflows/open-more.yaml
- scrollUntilVisible:
    element:
      text: "Or.amentos"
    direction: DOWN
    centerElement: true
- tapOn: "Or.amentos. Propostas|Or.amentos"
- runFlow:
    file: ../subflows/dismiss-guidance.yaml
- runFlow:
    when:
      notVisible: "Orcamento Teste"
    commands:
      - tapOn: "Criar or.amento|Novo or.amento|. Novo or.amento|Cadastrar or.amento"
      - extendedWaitUntil:
          visible:
            text: "Titulo do orcamento|Continuar"
          timeout: 8000
      - tapOn: "Titulo do orcamento"
      - inputText: "Orcamento Teste"
      - tapOn: "Continuar"
      - extendedWaitUntil:
          visible:
            text: "Item 1|Adicionar do cat"
          timeout: 8000
      - tapOn: "Item 1"
      - inputText: "Item teste"
      - tapOn: "Preco un"
      - inputText: "1000"
      - tapOn: "Continuar"
      - tapOn: "Revisar or.amento"
      - tapOn: "Salvar or.amento"
      - tapOn:
          point: "50%,55%"
- scrollUntilVisible:
    element:
      text: "Orcamento Teste"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 10
    centerElement: true
- takeScreenshot: .maestro/screenshots/12-orcamento
