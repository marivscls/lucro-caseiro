# 14 — Criar etiqueta, ou aceitar o paywall do limite free.
appId: br.com.orionseven.lucrocaseiro
name: 14 - Criar rotulo
tags:
  - crud
---
- runFlow:
    file: ../subflows/open-app.yaml
    env:
      EMAIL: "${EMAIL}"
      PASSWORD: "${PASSWORD}"

- runFlow:
    file: ../subflows/open-more.yaml
- scrollUntilVisible:
    element:
      text: "Etiquetas"
    direction: DOWN
    centerElement: true
- tapOn: "Etiquetas. Etiquetas|Etiquetas"
- runFlow:
    file: ../subflows/dismiss-guidance.yaml
- tapOn: "Criar etiqueta|Nova etiqueta|. Nova etiqueta"

- extendedWaitUntil:
    visible:
      text: "Nova etiqueta|Nome da etiqueta|Produto e modelo|Limite de"
    timeout: 8000
- runFlow:
    when:
      visible: "Limite de"
    commands:
      - tapOn:
          point: "50%,55%"
- runFlow:
    when:
      visible: "Nome da etiqueta"
    commands:
      - tapOn: "Nome da etiqueta"
      - inputText: "Rotulo Teste"
      - tapOn: "Buscar produto"
      - inputText: "teste"
      - tapOn: ".*Brigadeiro teste"
      - tapOn: "Continuar"
      - extendedWaitUntil:
          visible:
            text: "Nome que.*"
          timeout: 8000
      - tapOn: "Continuar"
      - tapOn: "Criar etiqueta"
      - tapOn:
          point: "50%,55%"
- takeScreenshot: .maestro/screenshots/14-rotulo
