<!doctype html>
<html lang="pt-BR">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Formulários — revisão visual</title
  ><style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 40px;
      background: #f5f3f1;
      color: #332f2c;
      font:
        16px/1.5 system-ui,
        sans-serif;
    }
    header {
      max-width: 760px;
      margin-bottom: 32px;
    }
    h1 {
      font-size: 30px;
      margin: 0 0 12px;
    }
    p {
      color: #68615d;
    }
    main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
    }
    figure {
      margin: 0;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 2px 12px #0000000b;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
    }
    figcaption {
      padding: 16px;
      font-weight: 600;
    }
    a:focus-visible {
      outline: 3px solid #a45868;
      outline-offset: -3px;
      display: block;
    }
    @media (max-width: 600px) {
      body {
        padding: 20px;
      }
    }
  </style>
  <header>
    <h1>Formulários mais claros e consistentes</h1>
    <p>
      Capturas locais com dados simulados. Toque em uma tela para ampliar. Layouts
      conferidos em 320, 390, 500 e 1440 px, com uma rodada adicional no tema escuro.
    </p>
  </header>
  <main>
    <figure>
      <a href="products-390.png" target="_blank"
        ><img src="products-390.png" alt="Novo produto" loading="lazy"
      /></a>
      <figcaption>Novo produto</figcaption>
    </figure>
    <figure>
      <a href="recurring-expenses-390.png" target="_blank"
        ><img src="recurring-expenses-390.png" alt="Novo gasto fixo" loading="lazy"
      /></a>
      <figcaption>Novo gasto fixo</figcaption>
    </figure>
    <figure>
      <a href="packaging-390.png" target="_blank"
        ><img src="packaging-390.png" alt="Nova embalagem" loading="lazy"
      /></a>
      <figcaption>Nova embalagem</figcaption>
    </figure>
    <figure>
      <a href="quotes-390.png" target="_blank"
        ><img src="quotes-390.png" alt="Novo orçamento" loading="lazy"
      /></a>
      <figcaption>Novo orçamento</figcaption>
    </figure>
    <figure>
      <a href="materials-390.png" target="_blank"
        ><img src="materials-390.png" alt="Novo insumo" loading="lazy"
      /></a>
      <figcaption>Novo insumo</figcaption>
    </figure>
    <figure>
      <a href="purchases-390.png" target="_blank"
        ><img src="purchases-390.png" alt="Nova compra" loading="lazy"
      /></a>
      <figcaption>Nova compra</figcaption>
    </figure>
    <figure>
      <a href="recipes-390.png" target="_blank"
        ><img src="recipes-390.png" alt="Nova receita" loading="lazy"
      /></a>
      <figcaption>Nova receita</figcaption>
    </figure>
    <figure>
      <a href="labels-390.png" target="_blank"
        ><img src="labels-390.png" alt="Nova etiqueta" loading="lazy"
      /></a>
      <figcaption>Nova etiqueta</figcaption>
    </figure>
    <figure>
      <a href="packaging-edit-390.png" target="_blank"
        ><img src="packaging-edit-390.png" alt="Editar embalagem" loading="lazy"
      /></a>
      <figcaption>Editar embalagem</figcaption>
    </figure>
    <figure>
      <a href="purchases-edit-390.png" target="_blank"
        ><img src="purchases-edit-390.png" alt="Editar compra" loading="lazy"
      /></a>
      <figcaption>Editar compra</figcaption>
    </figure>
    <figure>
      <a href="recipes-edit-390.png" target="_blank"
        ><img src="recipes-edit-390.png" alt="Editar receita" loading="lazy"
      /></a>
      <figcaption>Editar receita</figcaption>
    </figure>
    <figure>
      <a href="labels-edit-390.png" target="_blank"
        ><img src="labels-edit-390.png" alt="Prévia da etiqueta" loading="lazy"
      /></a>
      <figcaption>Prévia da etiqueta</figcaption>
    </figure>
  </main>
</html>
