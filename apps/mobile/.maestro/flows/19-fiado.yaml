# 19 — Venda fiado + Recebi na tela Fiado.
appId: br.com.orionseven.lucrocaseiro
name: 19 - Fiado recebi
tags:
  - crud
---
- runFlow:
    file: ../subflows/open-app.yaml
    env:
      EMAIL: "${EMAIL}"
      PASSWORD: "${PASSWORD}"

- tapOn:
    point: "10%,94%"
- tapOn: "Nova venda"
- runFlow:
    when:
      visible: "Agora n"
    commands:
      - tapOn: "Agora n"
- runFlow:
    when:
      visible: "Escolher produtos"
    commands:
      - tapOn: "Escolher produtos"
- extendedWaitUntil:
    visible:
      text: "Venda avulsa|Para quem|O que voc"
    timeout: 12000
- tapOn: "Buscar cliente"
- inputText: "Cliente Teste"
- scrollUntilVisible:
    element:
      text: "Selecionar .*Cliente Teste"
    direction: DOWN
    timeout: 8000
    visibilityPercentage: 10
    centerElement: true
- tapOn: "Selecionar .*Cliente Teste"
- tapOn: "Buscar produto"
- inputText: "Brigadeiro"
- tapOn: "Produto Brigadeiro teste|Brigadeiro teste"
- tapOn: "Ir para pagamento"
- tapOn: "Fiado|Pagamento para depois"
- tapOn: "Ir para revisao"
- tapOn: "Confirmar venda|Registrar venda"
- tapOn:
    point: "50%,58%"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"

- runFlow:
    file: ../subflows/open-app.yaml
    env:
      EMAIL: "${EMAIL}"
      PASSWORD: "${PASSWORD}"
- runFlow:
    file: ../subflows/open-more.yaml
- tapOn: "Fiado"
- extendedWaitUntil:
    visible:
      text: "Recebi"
    timeout: 20000
- tapOn: "Recebi"
- runFlow:
    when:
      visible: "Sim, recebi"
    commands:
      - tapOn: "Sim, recebi"
- takeScreenshot: .maestro/screenshots/19-fiado
