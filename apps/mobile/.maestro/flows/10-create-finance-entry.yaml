# 10 — Lançar financeiro (entrada). Gera dado real.
appId: br.com.orionseven.lucrocaseiro
name: 10 - Lancar financeiro
tags:
  - crud
---
- runFlow:
    file: ../subflows/open-app.yaml
    env:
      EMAIL: "${EMAIL}"
      PASSWORD: "${PASSWORD}"

# Atalho do dinheiro na home
- tapOn: "Ver financeiro"
- assertVisible: "Financeiro"
# O botão mostra apenas o ícone; o nome da ação permanece acessível.
- scrollUntilVisible:
    element:
      text: "^Novo lançamento$"
    direction: DOWN
- tapOn:
    text: "^Novo lançamento$"
- extendedWaitUntil:
    visible:
      text: "Entrada"
    timeout: 8000

# Tipo de lançamento
- tapOn: "Entrada"
# Valor
- tapOn:
    below:
      text: "Valor (R$)"
- inputText: "25,00"
# Descrição
- scrollUntilVisible:
    element:
      text: "Descrição"
    direction: DOWN
- tapOn:
    below:
      text: "Descrição"
- inputText: "[e2e] Lancamento teste"
# Categoria de entrada
- scrollUntilVisible:
    element:
      text: "Outra entrada|Venda"
    direction: DOWN
- tapOn: "Outra entrada"

# Salvar
- scrollUntilVisible:
    element:
      text: "Registrar lançamento"
    direction: DOWN
- tapOn: "Registrar lançamento"

# Sucesso: o lançamento aparece na lista
- extendedWaitUntil:
    visible:
      text: "[e2e] Lancamento teste"
    timeout: 10000
- takeScreenshot: .maestro/screenshots/10-financeiro
