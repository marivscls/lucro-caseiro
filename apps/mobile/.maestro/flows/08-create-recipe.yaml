# 08 — Criar receita / ficha de custo (wizard 3 etapas).
appId: br.com.orionseven.lucrocaseiro
name: 08 - Criar receita
tags:
  - crud
---
- runFlow:
    file: ../subflows/open-app.yaml
    env:
      EMAIL: "${EMAIL}"
      PASSWORD: "${PASSWORD}"

- runFlow:
    file: ../subflows/open-more.yaml
- scrollUntilVisible:
    element:
      text: "Receitas|Fichas de custo"
    direction: DOWN
    centerElement: true
- tapOn: "Receitas|Fichas de custo"
- runFlow:
    file: ../subflows/dismiss-guidance.yaml
- runFlow:
    when:
      notVisible: "Receita Teste"
    commands:
      - tapOn: "Criar ficha de custo|Criar receita|Cadastrar receita|Cadastrar ficha de custo|. Nova receita|. Nova ficha de custo|Nova receita|Nova ficha de custo"
      - extendedWaitUntil:
          visible:
            text: "Nome da ficha de custo|Nome da receita"
          timeout: 8000
      - tapOn:
          below:
            text: "Nome da ficha de custo|Nome da receita"
      - inputText: "[e2e] Receita Teste"
      - tapOn: "Categoria"
      - tapOn: "Escolher categoria"
      - extendedWaitUntil:
          visible:
            text: "Usar categoria"
          timeout: 8000
      - inputText: "Doces"
      - tapOn: "Usar categoria"
      - tapOn: "1 de 3"
      - tapOn: "Continuar"
      - extendedWaitUntil:
          visible:
            text: "Ex: 30 ou 1,5|unidades"
          timeout: 8000
      - tapOn: "Ex: 30 ou 1,5"
      - inputText: "10"
      - tapOn:
          text: "^unidades$"
      - tapOn: "2 de 3"
      - tapOn: "Continuar"
      - scrollUntilVisible:
          element:
            text: "Selecionar insumo|Selecionar material"
          direction: DOWN
          timeout: 15000
          centerElement: true
      - tapOn: "Selecionar insumo|Selecionar material"
      - swipe:
          direction: UP
      - tapOn:
          point: "50%,42%"
      - tapOn: "Quantidade"
      - inputText: "1"
      - tapOn: "Salvar ficha de custo|Salvar receita"
      - tapOn:
          point: "50%,55%"
      - runFlow:
          when:
            visible: "OK"
          commands:
            - tapOn: "OK"
- scrollUntilVisible:
    element:
      text: "Receita Teste"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 10
    centerElement: true
- takeScreenshot: .maestro/screenshots/08-receita
