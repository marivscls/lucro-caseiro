# 15 — Precificacao unificada. Abre pelo atalho da home.
appId: br.com.orionseven.lucrocaseiro
name: 15 - Precificacao
tags:
  - crud
---
- runFlow:
    file: ../subflows/open-app.yaml
    env:
      EMAIL: "${EMAIL}"
      PASSWORD: "${PASSWORD}"

- tapOn: "Calcular pre.o"
- runFlow:
    file: ../subflows/dismiss-guidance.yaml
- runFlow:
    when:
      visible: "Come.ar c.lculo"
    commands:
      - tapOn: "Come.ar c.lculo"
- extendedWaitUntil:
    visible:
      text: "Produto e custos|Precifica"
    timeout: 8000
- scrollUntilVisible:
    element:
      text: "Ingredientes ou material"
    direction: DOWN
- tapOn:
    below:
      text: "Ingredientes ou material"
- inputText: "10,00"
- tapOn: "Produto e custos"
- tapOn: "Continuar"
- tapOn: "Continuar"
- tapOn: "Salvar c.lculo"
- extendedWaitUntil:
    visible:
      text: ".*(salvo|Salvar|hist.rico|c.lculo).*"
    timeout: 10000
- takeScreenshot: .maestro/screenshots/15-precificacao
