# 06 — Criar cliente. Gera dado real na conta.
appId: br.com.orionseven.lucrocaseiro
name: 06 - Criar cliente
tags:
  - crud
---
- runFlow:
    file: ../subflows/open-app.yaml
    env:
      EMAIL: "${EMAIL}"
      PASSWORD: "${PASSWORD}"

- runFlow:
    file: ../subflows/open-more.yaml
- tapOn: "Clientes"
- runFlow:
    file: ../subflows/dismiss-guidance.yaml
- runFlow:
    when:
      notVisible: "Cliente Teste"
    commands:
      - tapOn: "Novo cliente|. Novo cliente|Cadastrar cliente"
      - extendedWaitUntil:
          visible:
            text: "Nome do cliente"
          timeout: 8000
      - tapOn: "Nome do cliente"
      - inputText: "[e2e] Cliente Teste"
      - tapOn:
          text: "Cadastrar cliente"
          point: "50%, 20%"
      - runFlow:
          when:
            visible: "Informe o nome"
          commands:
            - tapOn: "Nome do cliente"
            - eraseText
            - inputText: "[e2e] Cliente Teste"
            - tapOn:
                text: "Cadastrar cliente"
                point: "50%, 20%"
      - tapOn:
          point: "50%,55%"
      - runFlow:
          when:
            visible: "OK"
          commands:
            - tapOn: "OK"
- runFlow:
    when:
      visible: "Fechar"
    commands:
      - tapOn: "Fechar"
- tapOn: "Buscar cliente"
- inputText: "Cliente Teste"
- scrollUntilVisible:
    element:
      text: "Cliente Teste"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 10
    centerElement: true
- takeScreenshot: .maestro/screenshots/06-cliente
