# 13 — Criar embalagem, ou aceitar o paywall do limite free.
appId: br.com.orionseven.lucrocaseiro
name: 13 - Criar embalagem
tags:
  - crud
---
- runFlow:
    file: ../subflows/open-app.yaml
    env:
      EMAIL: "${EMAIL}"
      PASSWORD: "${PASSWORD}"

- runFlow:
    file: ../subflows/open-more.yaml
- scrollUntilVisible:
    element:
      text: "Embalagens"
    direction: DOWN
    centerElement: true
- tapOn: "Embalagens. Custos|Embalagens"
- runFlow:
    file: ../subflows/dismiss-guidance.yaml
- tapOn: "Cadastrar embalagem|Nova embalagem|. Nova embalagem|acabamento"

- extendedWaitUntil:
    visible:
      text: "Nova embalagem|Cadastrar"
    timeout: 8000
- tapOn:
    below:
      text: "Nome"
- inputText: "[e2e] Caixa teste"
- tapOn: "Caixa"
- tapOn:
    below:
      text: "Valor em reais"
- inputText: "1,50"
- tapOn: "Tipo de embalagem"
- tapOn:
    text: "^Cadastrar$"

- extendedWaitUntil:
    visible:
      text: ".*(Caixa|Limite de embalagens|Premium).*"
    timeout: 12000
- takeScreenshot: .maestro/screenshots/13-embalagem
