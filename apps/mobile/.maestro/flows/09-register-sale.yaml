# 09 — Registrar venda. Venda avulsa avança para produtos.
appId: br.com.orionseven.lucrocaseiro
name: 09 - Registrar venda
tags:
  - crud
---
- runFlow:
    file: ../subflows/open-app.yaml
    env:
      EMAIL: "${EMAIL}"
      PASSWORD: "${PASSWORD}"

- tapOn:
    point: "10%,94%"
- tapOn: "Nova venda"
- runFlow:
    when:
      visible: "Agora n"
    commands:
      - tapOn: "Agora n"
- runFlow:
    when:
      visible: "Escolher produtos"
    commands:
      - tapOn: "Escolher produtos"
- extendedWaitUntil:
    visible:
      text: "Venda avulsa|Para quem|O que voc"
    timeout: 12000
- runFlow:
    when:
      visible: "Venda avulsa"
    commands:
      - tapOn: "Continuar sem cliente|Venda avulsa"
- tapOn: "Buscar produto"
- inputText: "Brigadeiro"
- tapOn: "Produto Brigadeiro teste|Brigadeiro teste"
- tapOn: "Ir para pagamento"
- tapOn: "Pix"
- tapOn: "Ir para revisao"
- tapOn: "Confirmar venda|Registrar venda"
- tapOn:
    point: "50%,58%"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- takeScreenshot: .maestro/screenshots/09-venda
