# 11 — Criar encomenda na Agenda.
appId: br.com.orionseven.lucrocaseiro
name: 11 - Criar encomenda
tags:
  - crud
---
- runFlow:
    file: ../subflows/open-app.yaml
    env:
      EMAIL: "${EMAIL}"
      PASSWORD: "${PASSWORD}"

- repeat:
    times: 8
    commands:
      - runFlow:
          when:
            visible: "Dismiss"
          commands:
            - tapOn: "Dismiss"
      - runFlow:
          when:
            notVisible: "Sua agenda|Nova encomenda|Novo pedido|Adicionar compromisso"
          commands:
            - tapOn:
                point: "70%,94%"
- runFlow:
    file: ../subflows/dismiss-guidance.yaml
- runFlow:
    when:
      notVisible: "Bolo teste"
    commands:
      - tapOn: "Adicionar compromisso|Nova encomenda|Novo pedido|. Nova encomenda|. Novo pedido|Cadastrar encomenda"
      - extendedWaitUntil:
          visible:
            text: "Nome da encomenda|Continuar"
          timeout: 8000
      - tapOn: "Nome da encomenda"
      - inputText: "Bolo teste"
      - tapOn: "Continuar"
      - extendedWaitUntil:
          visible:
            text: "Hoje"
          timeout: 8000
      - tapOn: "Hoje"
      - tapOn: "Continuar"
      - tapOn: "Salvar encomenda|Salvar pedido"
      - extendedWaitUntil:
          notVisible:
            text: "Salvar encomenda|Salvar pedido|Data de entrega"
          timeout: 45000
- tapOn: "Hoje, .*"
- scrollUntilVisible:
    element:
      text: "Bolo teste"
    direction: DOWN
    timeout: 40000
    speed: 90
    visibilityPercentage: 10
    centerElement: true
- takeScreenshot: .maestro/screenshots/11-encomenda
