app = "lucro-caseiro-app"
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "apps/mobile/Dockerfile"

[build.args]
  EXPO_PUBLIC_API_URL = "https://api.lucrocaseiro.com.br"
  EXPO_PUBLIC_SUPABASE_URL = "https://ujwxvpceqigvyxcqolch.supabase.co"
  EXPO_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_62oHpKLLLGkVgWqA-aZ9Pg_bLR1UiCq"
  EXPO_PUBLIC_CATALOG_URL = "https://catalogo.lucrocaseiro.com.br"
  EXPO_PUBLIC_AUTH_REDIRECT_URL = "https://app.lucrocaseiro.com.br/auth/callback"

[env]
  NODE_ENV = "production"
  PORT = "8083"
  EXPO_PUBLIC_API_URL = "https://api.lucrocaseiro.com.br"
  EXPO_PUBLIC_SUPABASE_URL = "https://ujwxvpceqigvyxcqolch.supabase.co"
  EXPO_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_62oHpKLLLGkVgWqA-aZ9Pg_bLR1UiCq"
  EXPO_PUBLIC_CATALOG_URL = "https://catalogo.lucrocaseiro.com.br"
  EXPO_PUBLIC_AUTH_REDIRECT_URL = "https://app.lucrocaseiro.com.br/auth/callback"

[http_service]
  internal_port = 8083
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"
  method = "GET"
  path = "/"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
